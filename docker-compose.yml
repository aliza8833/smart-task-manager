services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - PORT=4000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000

volumes:
  sqlite_data: